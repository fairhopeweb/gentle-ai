<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" aria-labelledby="oddTitle oddDesc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" viewBox="0 0 1240 860"><title id="oddTitle">Organic Driven Development keeps work proportional</title><desc id="oddDesc">Organic Driven Development starts by authorizing and exploring a request. Read-only work explores or explains before closing with an answer. Authorized work resolves real uncertainty, then classifies as small or substantial. Both routes have equal weight: small work stays light, while substantial work creates a feature document and Engram mirror before the first source write. Both implement, check, and close with a verified outcome. The human remains in control of delivery.</desc><defs><radialGradient id="oddAmbient" cx="12%" cy="0%" r="70%"><stop offset="0%" stop-color="#F095C8" stop-opacity=".16"/><stop offset="100%" stop-color="#F095C8" stop-opacity="0"/></radialGradient></defs><rect width="1240" height="860" fill="#1A1218" rx="24"/><rect width="1240" height="860" fill="url(#oddAmbient)" rx="24"/><text x="40" y="58" fill="#F7ECF2" font-size="27" font-weight="700">ODD — progress with only the structure you need</text><text x="41" y="88" fill="#A88E9B" font-size="14.5">Understand the work first. Then keep the path proportional and the outcome honest.</text><rect width="220" height="34" x="980" y="38" fill="#2C1F27" stroke="#4A3540" rx="17"/><text x="1090" y="60" fill="#D7A0B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" text-anchor="middle">default workflow</text><rect width="1160" height="214" x="40" y="126" fill="#221820" stroke="#392A33" rx="20"/><text x="68" y="202" fill="#F095C8" font-size="34" font-weight="700" opacity=".22">01</text><text x="68" y="228" fill="#D7A0B8" font-size="13" font-weight="700" letter-spacing="2">UNDERSTAND</text><line x1="200" x2="200" y1="154" y2="312" stroke="#392A33"/><rect width="276" height="90" x="224" y="160" fill="#2C1F27" stroke="#4A3540" rx="14"/><text x="244" y="193" fill="#F095C8" font-size="10.5" font-weight="700" letter-spacing="1.2" opacity=".6">01 · AUTHORIZE</text><text x="244" y="218" fill="#F7ECF2" font-size="17" font-weight="600">Is a change authorized?</text><text x="244" y="238" fill="#9C8391" font-size="11.5">Read-only requests stay read-only.</text><path fill="none" stroke="#6B4F5D" stroke-linecap="round" stroke-width="2" d="M500 205 H516"/><path fill="none" stroke="#6B4F5D" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M509 199 L517 205 L509 211"/><rect width="276" height="90" x="526" y="160" fill="#2C1F27" stroke="#4A3540" rx="14"/><text x="546" y="193" fill="#F095C8" font-size="10.5" font-weight="700" letter-spacing="1.2" opacity=".6">02 · EXPLORE</text><text x="546" y="218" fill="#F7ECF2" font-size="17" font-weight="600">Understand before changing</text><text x="546" y="238" fill="#9C8391" font-size="11.5">Code, requirements and scope.</text><path fill="none" stroke="#6B4F5D" stroke-linecap="round" stroke-width="2" d="M802 205 H818"/><path fill="none" stroke="#6B4F5D" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M811 199 L819 205 L811 211"/><rect width="348" height="90" x="828" y="160" fill="#2C1F27" stroke="#4A3540" rx="14"/><text x="848" y="193" fill="#F095C8" font-size="10.5" font-weight="700" letter-spacing="1.2" opacity=".6">03 · RESOLVE UNCERTAINTY</text><text x="848" y="218" fill="#F7ECF2" font-size="17" font-weight="600">Ask only when a real decision remains</text><text x="848" y="238" fill="#9C8391" font-size="11.5">Research is optional and scoped to the uncertainty.</text><path fill="none" stroke="#6B4F5D" stroke-dasharray="4 4" stroke-linecap="round" stroke-width="1.75" d="M664 250 V270"/><path fill="none" stroke="#6B4F5D" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M658 264 L664 271 L670 264"/><rect width="276" height="36" x="526" y="280" fill="#251A21" stroke="#6B4F5D" stroke-dasharray="5 4" rx="12"/><text x="664" y="303" fill="#D7A0B8" font-size="11" text-anchor="middle">READ-ONLY · explore or explain, then close</text><rect width="1160" height="252" x="40" y="364" fill="#221820" stroke="#392A33" rx="20"/><text x="68" y="458" fill="#F095C8" font-size="34" font-weight="700" opacity=".22">02</text><text x="68" y="484" fill="#D7A0B8" font-size="13" font-weight="700" letter-spacing="2">ADAPT</text><line x1="200" x2="200" y1="392" y2="588" stroke="#392A33"/><path fill="none" stroke="#F095C8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1002 250 V374 H700 V384"/><path fill="none" stroke="#F095C8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M693 377 L700 385 L707 377"/><rect width="952" height="76" x="224" y="398" fill="#2A1B24" stroke="#F095C8" stroke-opacity=".5" rx="14"/><text x="246" y="426" fill="#F095C8" font-size="10.5" font-weight="700" letter-spacing="1.2" opacity=".7">04 · CLASSIFY</text><text x="246" y="452" fill="#F7ECF2" font-size="17" font-weight="600">What does this understood, authorized work need?</text><path fill="none" stroke="#F095C8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M700 474 V492 H449 V510"/><path fill="none" stroke="#F095C8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M700 474 V492 H951 V510"/><path fill="none" stroke="#F095C8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M443 503 L449 511 L455 503"/><path fill="none" stroke="#F095C8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M945 503 L951 511 L957 503"/><rect width="450" height="82" x="224" y="520" fill="#2A1B24" stroke="#F095C8" stroke-opacity=".5" rx="14"/><text x="246" y="546" fill="#F095C8" font-size="10.5" font-weight="700" letter-spacing="1.2" opacity=".75">05 · SMALL, UNDERSTOOD WORK</text><text x="246" y="570" fill="#F7ECF2" font-size="16.5" font-weight="600">Stay light</text><text x="246" y="588" fill="#9C8391" font-size="11.5">No durable task artifacts. Use the smallest safe topology.</text><rect width="450" height="82" x="726" y="520" fill="#2A1B24" stroke="#F095C8" stroke-opacity=".5" rx="14"/><text x="748" y="546" fill="#F095C8" font-size="10.5" font-weight="700" letter-spacing="1.2" opacity=".75">05 · SUBSTANTIAL IMPLEMENTATION</text><text x="748" y="570" fill="#F7ECF2" font-size="16.5" font-weight="600">Keep a recoverable feature record</text><text x="748" y="588" fill="#D7A0B8" font-size="11.5">Feature document + Engram mirror before the first write.</text><rect width="1160" height="164" x="40" y="640" fill="#221820" stroke="#392A33" rx="20"/><text x="68" y="714" fill="#F095C8" font-size="34" font-weight="700" opacity=".22">03</text><text x="68" y="740" fill="#D7A0B8" font-size="13" font-weight="700" letter-spacing="2">ADVANCE</text><line x1="200" x2="200" y1="668" y2="776" stroke="#392A33"/><path fill="none" stroke="#F095C8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M449 602 V634 H449 V674"/><path fill="none" stroke="#F095C8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M951 602 V634 H449"/><path fill="none" stroke="#F095C8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M443 667 L449 675 L455 667"/><rect width="450" height="92" x="224" y="684" fill="#2C1F27" stroke="#4A3540" rx="14"/><text x="246" y="714" fill="#F095C8" font-size="10.5" font-weight="700" letter-spacing="1.2" opacity=".65">06 · IMPLEMENT + CHECK</text><text x="246" y="741" fill="#F7ECF2" font-size="17" font-weight="600">Implement the next authorized task</text><text x="246" y="761" fill="#9C8391" font-size="11.5">Run the configured TDD mode and proportionate checks.</text><path fill="none" stroke="#F095C8" stroke-linecap="round" stroke-width="2" d="M674 730 H718"/><path fill="none" stroke="#F095C8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M711 724 L719 730 L711 736"/><rect width="450" height="92" x="726" y="684" fill="#2A1B24" stroke="#F095C8" stroke-opacity=".5" rx="14"/><text x="748" y="714" fill="#F095C8" font-size="10.5" font-weight="700" letter-spacing="1.2" opacity=".75">07 · CLOSE</text><text x="748" y="741" fill="#F7ECF2" font-size="17" font-weight="600">Close with a verified outcome</text><text x="748" y="761" fill="#D7A0B8" font-size="11.5">Record failed or pending checks and the next step.</text><line x1="40" x2="1200" y1="830" y2="830" stroke="#392A33"/><text x="620" y="850" fill="#8A6E7C" font-size="12" text-anchor="middle">Understand first. Keep work proportional. Close with evidence.</text></svg>