<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="730" aria-labelledby="engTitle engDesc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" viewBox="0 0 1240 730"><title id="engTitle">How Engram keeps project context</title><desc id="engDesc">Three work sessions sit side by side, separated by a restart and by context compaction. Each break cuts the session layer but stops at the memory layer underneath. In the first session the agent saves a decision. The next session, with zero history, asks memory before it asks you. Weeks later the same question is answered from memory rather than by re-reading the repository. Engram saves automatically as you work, and engram sync writes the memories into the repo so a teammate starts with the same context.</desc><defs><radialGradient id="engAmbient" cx="12%" cy="0%" r="70%"><stop offset="0%" stop-color="#F095C8" stop-opacity=".16"/><stop offset="100%" stop-color="#F095C8" stop-opacity="0"/></radialGradient></defs><rect width="1240" height="730" fill="#1A1218" rx="24"/><rect width="1240" height="730" fill="url(#engAmbient)" rx="24"/><text x="40" y="58" fill="#F7ECF2" font-size="27" font-weight="700">Engram™ — context that outlives the session</text><text x="41" y="88" fill="#A88E9B" font-size="14.5">Restarts and compaction cut the conversation. They do not cut the memory underneath it.</text><rect width="278" height="34" x="922" y="38" fill="#2C1F27" stroke="#4A3540" rx="17"/><text x="1061" y="60" fill="#D7A0B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" text-anchor="middle">automatic · nothing to memorize</text><rect width="120" height="26" x="355" y="127" fill="#2C1F27" stroke="#4A3540" rx="13"/><text x="415" y="145" fill="#9C8391" font-size="10.5" font-weight="700" letter-spacing="1.2" text-anchor="middle">RESTART</text><path stroke="#5A414E" stroke-dasharray="5 5" stroke-width="1.5" d="M415 165 L415 452"/><rect width="150" height="26" x="750" y="127" fill="#2C1F27" stroke="#4A3540" rx="13"/><text x="825" y="145" fill="#9C8391" font-size="10.5" font-weight="700" letter-spacing="1.2" text-anchor="middle">COMPACTION</text><path stroke="#5A414E" stroke-dasharray="5 5" stroke-width="1.5" d="M825 165 L825 452"/><rect width="340" height="160" x="40" y="185" fill="#221820" stroke="#392A33" rx="18"/><text x="64" y="222" fill="#F095C8" font-size="11" font-weight="700" letter-spacing="1.6" opacity=".55">FIRST SESSION</text><text x="64" y="256" fill="#F7ECF2" font-size="17" font-weight="600">You make a call</text><text x="64" y="284" fill="#9C8391" font-size="12">You pick Postgres over Mongo,</text><text x="64" y="302" fill="#9C8391" font-size="12">and say why.</text><text x="64" y="330" fill="#F095C8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">mem_save</text><rect width="340" height="160" x="450" y="185" fill="#221820" stroke="#392A33" rx="18"/><text x="474" y="222" fill="#F095C8" font-size="11" font-weight="700" letter-spacing="1.6" opacity=".55">NEXT SESSION</text><text x="474" y="256" fill="#F7ECF2" font-size="17" font-weight="600">A blank agent</text><text x="474" y="284" fill="#9C8391" font-size="12">Zero history in the window.</text><text x="474" y="302" fill="#9C8391" font-size="12">It asks memory before it asks you.</text><text x="474" y="330" fill="#F095C8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">mem_context</text><rect width="340" height="160" x="860" y="185" fill="#241A22" stroke="#F095C8" stroke-opacity=".5" rx="18"/><text x="884" y="222" fill="#F095C8" font-size="11" font-weight="700" letter-spacing="1.6" opacity=".55">WEEKS LATER</text><text x="884" y="256" fill="#F7ECF2" font-size="17" font-weight="600">“Why Postgres?”</text><text x="884" y="284" fill="#D7A0B8" font-size="12">Answered from memory — not by</text><text x="884" y="302" fill="#D7A0B8" font-size="12">re-reading the whole repo.</text><text x="884" y="330" fill="#F095C8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">mem_search</text><path stroke="#F095C8" stroke-linecap="round" stroke-width="2" d="M210 356 L210 440"/><path fill="none" stroke="#F095C8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M204 434 L210 442 L216 434"/><text x="224" y="404" fill="#8A6E7C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">save</text><path stroke="#D7A0B8" stroke-dasharray="4 4" stroke-linecap="round" stroke-width="2" d="M540 440 L540 356"/><path fill="none" stroke="#D7A0B8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M534 362 L540 354 L546 362"/><text x="554" y="404" fill="#8A6E7C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">recall</text><path stroke="#F095C8" stroke-linecap="round" stroke-width="2" d="M712 356 L712 440"/><path fill="none" stroke="#F095C8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M706 434 L712 442 L718 434"/><text x="726" y="404" fill="#8A6E7C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">save</text><path stroke="#D7A0B8" stroke-dasharray="4 4" stroke-linecap="round" stroke-width="2" d="M950 440 L950 356"/><path fill="none" stroke="#D7A0B8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M944 362 L950 354 L956 362"/><text x="964" y="404" fill="#8A6E7C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">recall</text><rect width="1160" height="118" x="40" y="452" fill="#2A1B24" stroke="#F095C8" stroke-opacity=".45" rx="18"/><text x="64" y="488" fill="#F7ECF2" font-size="18" font-weight="600">One memory, for the whole project</text><text x="64" y="512" fill="#A88E9B" font-size="12">Written as you work. You never call a command.</text><rect width="86" height="26" x="64" y="528" fill="#3A2530" stroke="#8A5E75" rx="13"/><text x="107" y="546" fill="#D7A0B8" font-size="11" text-anchor="middle">decision</text><rect width="78" height="26" x="160" y="528" fill="#3A2530" stroke="#8A5E75" rx="13"/><text x="199" y="546" fill="#D7A0B8" font-size="11" text-anchor="middle">bugfix</text><rect width="94" height="26" x="248" y="528" fill="#3A2530" stroke="#8A5E75" rx="13"/><text x="295" y="546" fill="#D7A0B8" font-size="11" text-anchor="middle">discovery</text><rect width="104" height="26" x="352" y="528" fill="#3A2530" stroke="#8A5E75" rx="13"/><text x="404" y="546" fill="#D7A0B8" font-size="11" text-anchor="middle">convention</text><text x="1176" y="512" fill="#F095C8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="end">project = normalized git remote URL</text><text x="1176" y="546" fill="#7E6672" font-size="11" text-anchor="end">Local by default. Nothing leaves your machine.</text><rect width="1160" height="54" x="40" y="598" fill="#221820" stroke="#392A33" rx="16"/><text x="620" y="623" fill="#F095C8" font-size="15" font-weight="700" text-anchor="middle">Hand it to the team</text><text x="620" y="643" fill="#A88E9B" font-size="12" text-anchor="middle">engram sync writes the memories into the repo. A teammate clones, imports, and their first session already knows the project.</text><text x="620" y="694" fill="#8A6E7C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">engram sync · engram sync --import</text></svg>