<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" aria-labelledby="rddTitle rddDesc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" viewBox="0 0 1240 740"><title id="rddTitle">How RDD checks a finished change</title><desc id="rddDesc">Receipt-Driven Development is opt-out and on by default. First the exact change is frozen to a lineage, revision and target. Then a read-only risk assessment decides the depth: passive gets a structural readback with zero reviewer lenses, medium gets one focused lens, high gets the canonical 4R — Risk, Resilience, Readability and Reliability — in parallel. At most one bounded correction is allowed. One exact acknowledgement closes the transaction and burns the authority. Delivery stays human-owned: a review never commits, pushes or opens a pull request.</desc><defs><radialGradient id="rddAmbient" cx="12%" cy="0%" r="70%"><stop offset="0%" stop-color="#F095C8" stop-opacity=".16"/><stop offset="100%" stop-color="#F095C8" stop-opacity="0"/></radialGradient></defs><rect width="1240" height="740" fill="#1A1218" rx="24"/><rect width="1240" height="740" fill="url(#rddAmbient)" rx="24"/><text x="40" y="58" fill="#F7ECF2" font-size="27" font-weight="700">RDD — checked at the right depth</text><text x="41" y="88" fill="#A88E9B" font-size="14.5">The change is frozen first, then its own risk decides how hard it gets reviewed.</text><rect width="238" height="34" x="962" y="38" fill="#2C1F27" stroke="#4A3540" rx="17"/><text x="1081" y="60" fill="#D7A0B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" text-anchor="middle">opt-out · on by default</text><text x="40" y="160" fill="#D7A0B8" font-size="12" font-weight="700" letter-spacing="2"><tspan fill="#F095C8" opacity=".5">01 </tspan>FREEZE</text><text x="292" y="160" fill="#D7A0B8" font-size="12" font-weight="700" letter-spacing="2"><tspan fill="#F095C8" opacity=".5">02 </tspan>ASSESS</text><text x="478" y="160" fill="#D7A0B8" font-size="12" font-weight="700" letter-spacing="2"><tspan fill="#F095C8" opacity=".5">03 </tspan>CHECK</text><text x="950" y="160" fill="#D7A0B8" font-size="12" font-weight="700" letter-spacing="2"><tspan fill="#F095C8" opacity=".5">04 </tspan>ACKNOWLEDGE</text><rect width="230" height="210" x="40" y="278" fill="#221820" stroke="#392A33" rx="18"/><rect width="22" height="15" x="64" y="320" fill="none" stroke="#F095C8" stroke-width="2" rx="3"/><path fill="none" stroke="#F095C8" stroke-width="2" d="M69 320 v-5 a6 6 0 0 1 12 0 v5"/><text x="64" y="374" fill="#F7ECF2" font-size="19" font-weight="600">Freeze</text><text x="64" y="400" fill="#9C8391" font-size="12">The exact change is locked</text><text x="64" y="418" fill="#9C8391" font-size="12">before anything reads it.</text><text x="64" y="454" fill="#F095C8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">lineage · revision · target</text><path stroke="#6B4F5D" stroke-linecap="round" stroke-width="2" d="M270 383 L284 383"/><path fill="none" stroke="#6B4F5D" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M279 378 L286 383 L279 388"/><rect width="130" height="130" x="292" y="318" fill="#221820" stroke="#392A33" rx="18"/><text x="357" y="370" fill="#F7ECF2" font-size="17" font-weight="600" text-anchor="middle">Assess</text><text x="357" y="393" fill="#9C8391" font-size="11.5" text-anchor="middle">Risk decides,</text><text x="357" y="409" fill="#9C8391" font-size="11.5" text-anchor="middle">not the model.</text><text x="357" y="432" fill="#F095C8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle">read-only</text><path fill="none" stroke="#6B4F5D" stroke-dasharray="4 4" stroke-width="1.5" d="M422 383 C 448 383, 452 232, 478 232"/><path fill="none" stroke="#6B4F5D" stroke-dasharray="4 4" stroke-width="1.5" d="M422 383 C 448 383, 452 352, 478 352"/><path fill="none" stroke="#6B4F5D" stroke-dasharray="4 4" stroke-width="1.5" d="M422 383 C 448 383, 452 472, 478 472"/><rect width="442" height="104" x="478" y="180" fill="#221820" stroke="#392A33" rx="16"/><rect width="92" height="26" x="498" y="202" fill="#2C1F27" stroke="#4A3540" rx="13"/><text x="544" y="220" fill="#9C8391" font-size="10.5" font-weight="700" letter-spacing="1.2" text-anchor="middle">PASSIVE</text><text x="610" y="222" fill="#F7ECF2" font-size="17" font-weight="600">Structural readback</text><text x="610" y="246" fill="#9C8391" font-size="12">Zero reviewer lenses. Nothing to argue about.</text><text x="610" y="266" fill="#7E6672" font-size="11.5">Docs proven passive by their own frozen bytes</text><rect width="442" height="104" x="478" y="300" fill="#221820" stroke="#4A3540" rx="16"/><rect width="92" height="26" x="498" y="322" fill="#3A2530" stroke="#8A5E75" rx="13"/><text x="544" y="340" fill="#D7A0B8" font-size="10.5" font-weight="700" letter-spacing="1.2" text-anchor="middle">MEDIUM</text><text x="610" y="342" fill="#F7ECF2" font-size="17" font-weight="600">One focused lens</text><text x="610" y="366" fill="#9C8391" font-size="12">A single reviewer on the frozen candidate.</text><text x="610" y="386" fill="#7E6672" font-size="11.5">You are asked for consent before it runs</text><rect width="442" height="104" x="478" y="420" fill="#241A22" stroke="#F095C8" stroke-opacity=".5" rx="16"/><rect width="92" height="26" x="498" y="442" fill="#4A2233" stroke="#F095C8" rx="13"/><text x="544" y="460" fill="#F095C8" font-size="10.5" font-weight="700" letter-spacing="1.2" text-anchor="middle">HIGH</text><text x="610" y="462" fill="#F7ECF2" font-size="17" font-weight="600">The canonical 4R</text><text x="610" y="486" fill="#9C8391" font-size="12">Four reviewers, launched in parallel.</text><text x="610" y="506" fill="#D7A0B8" font-size="11.5">Risk · Resilience · Readability · Reliability</text><rect width="442" height="44" x="478" y="544" fill="#221820" stroke="#392A33" stroke-dasharray="5 4" rx="12"/><text x="498" y="566" fill="#D7A0B8" font-size="13" font-weight="600">At most one bounded correction</text><text x="498" y="582" fill="#7E6672" font-size="11.5">Never a loop that grinds until clean.</text><path stroke="#6B4F5D" stroke-linecap="round" stroke-width="2" d="M920 383 L934 383"/><path fill="none" stroke="#6B4F5D" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M929 378 L936 383 L929 388"/><rect width="250" height="210" x="950" y="278" fill="#221820" stroke="#392A33" rx="18"/><text x="974" y="340" fill="#F7ECF2" font-size="19" font-weight="600">Acknowledge</text><text x="974" y="370" fill="#9C8391" font-size="12">One exact command closes</text><text x="974" y="388" fill="#9C8391" font-size="12">the transaction, and the</text><text x="974" y="406" fill="#9C8391" font-size="12">authority burns.</text><text x="974" y="444" fill="#F095C8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">nothing survives to reuse</text><rect width="1160" height="54" x="40" y="612" fill="#2A1B24" stroke="#5A3A49" rx="16"/><text x="620" y="637" fill="#F095C8" font-size="15" font-weight="700" text-anchor="middle">Delivery stays yours</text><text x="620" y="657" fill="#A88E9B" font-size="12" text-anchor="middle">A review is informational. It never commits, pushes, or opens a pull request.</text><text x="620" y="702" fill="#8A6E7C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">gentle-ai review mode enable --scope global</text></svg>