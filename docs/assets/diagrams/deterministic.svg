<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" aria-labelledby="detTitle detDesc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" viewBox="0 0 1240 680"><title id="detTitle">Why the next step is deterministic</title><desc id="detDesc">A different agent, a different model, and a brand-new session all converge on the same thing: the gentle-ai binary. It reads the change state from files on disk and returns the only valid next transition, so no model votes on what comes next. The answer is always one of four public states — Working, Checking, Ready, or Needs your decision — and asking again tomorrow from another agent returns the same answer, because it was derived rather than improvised.</desc><defs><radialGradient id="detAmbient" cx="12%" cy="0%" r="70%"><stop offset="0%" stop-color="#F095C8" stop-opacity=".16"/><stop offset="100%" stop-color="#F095C8" stop-opacity="0"/></radialGradient></defs><rect width="1240" height="680" fill="#1A1218" rx="24"/><rect width="1240" height="680" fill="url(#detAmbient)" rx="24"/><text x="40" y="58" fill="#F7ECF2" font-size="27" font-weight="700">Deterministic by design</text><text x="41" y="88" fill="#A88E9B" font-size="14.5">Change the agent, the model, the day. The next valid step does not move.</text><rect width="254" height="34" x="946" y="38" fill="#2C1F27" stroke="#4A3540" rx="17"/><text x="1073" y="60" fill="#D7A0B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" text-anchor="middle">derived · never improvised</text><text x="40" y="160" fill="#D7A0B8" font-size="12" font-weight="700" letter-spacing="2"><tspan fill="#F095C8" opacity=".5">01 </tspan>WHOEVER ASKS</text><text x="390" y="160" fill="#D7A0B8" font-size="12" font-weight="700" letter-spacing="2"><tspan fill="#F095C8" opacity=".5">02 </tspan>ONE ENGINE</text><text x="830" y="160" fill="#D7A0B8" font-size="12" font-weight="700" letter-spacing="2"><tspan fill="#F095C8" opacity=".5">03 </tspan>ONE ANSWER</text><rect width="250" height="92" x="40" y="182" fill="#221820" stroke="#392A33" rx="16"/><text x="64" y="220" fill="#F7ECF2" font-size="15" font-weight="600">A different agent</text><text x="64" y="244" fill="#9C8391" font-size="11.5">Pi, Codex, OpenCode, Claude Code</text><rect width="250" height="92" x="40" y="292" fill="#221820" stroke="#392A33" rx="16"/><text x="64" y="330" fill="#F7ECF2" font-size="15" font-weight="600">A different model</text><text x="64" y="354" fill="#9C8391" font-size="11.5">Any of them. It is not consulted.</text><rect width="250" height="92" x="40" y="402" fill="#221820" stroke="#392A33" rx="16"/><text x="64" y="440" fill="#F7ECF2" font-size="15" font-weight="600">A brand-new session</text><text x="64" y="464" fill="#9C8391" font-size="11.5">Zero history in the window</text><path fill="none" stroke="#6B4F5D" stroke-width="1.8" d="M290 228 C 334 228, 342 308, 382 308"/><path fill="none" stroke="#6B4F5D" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M376 303 L384 308 L376 313"/><path fill="none" stroke="#6B4F5D" stroke-width="1.8" d="M290 338 L382 338"/><path fill="none" stroke="#6B4F5D" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M376 333 L384 338 L376 343"/><path fill="none" stroke="#6B4F5D" stroke-width="1.8" d="M290 448 C 334 448, 342 368, 382 368"/><path fill="none" stroke="#6B4F5D" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M376 363 L384 368 L376 373"/><rect width="380" height="312" x="390" y="182" fill="#241A22" stroke="#F095C8" stroke-opacity=".5" rx="18"/><text x="414" y="240" fill="#F7ECF2" font-size="19" font-weight="600">The binary decides</text><text x="414" y="266" fill="#F095C8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">gentle-ai</text><line x1="414" x2="746" y1="286" y2="286" stroke="#4A3540"/><text x="414" y="316" fill="#9C8391" font-size="12">It reads the state of the change</text><text x="414" y="334" fill="#9C8391" font-size="12">from files on disk, then returns the</text><text x="414" y="352" fill="#9C8391" font-size="12">only transition that is valid next.</text><line x1="414" x2="746" y1="376" y2="376" stroke="#4A3540"/><text x="414" y="402" fill="#D7A0B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">openspec/changes/&lt;change&gt;/</text><text x="414" y="438" fill="#F095C8" font-size="13.5" font-weight="700">No model votes on this.</text><path stroke="#F095C8" stroke-linecap="round" stroke-width="2.2" d="M770 338 L822 338"/><path fill="none" stroke="#F095C8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M815 331 L824 338 L815 345"/><rect width="370" height="312" x="830" y="182" fill="#221820" stroke="#392A33" rx="18"/><text x="854" y="240" fill="#F7ECF2" font-size="19" font-weight="600">One valid next step</text><text x="854" y="266" fill="#9C8391" font-size="12">Always one of four public states.</text><line x1="854" x2="1176" y1="286" y2="286" stroke="#4A3540"/><rect width="250" height="28" x="854" y="304" fill="#2C1F27" stroke="#4A3540" rx="14"/><circle cx="872" cy="318" r="4" fill="#D7A0B8"/><text x="888" y="323" fill="#D7A0B8" font-size="12">Working</text><rect width="250" height="28" x="854" y="340" fill="#2C1F27" stroke="#4A3540" rx="14"/><circle cx="872" cy="354" r="4" fill="#D7A0B8"/><text x="888" y="359" fill="#D7A0B8" font-size="12">Checking</text><rect width="250" height="28" x="854" y="376" fill="#2C1F27" stroke="#4A3540" rx="14"/><circle cx="872" cy="390" r="4" fill="#D7A0B8"/><text x="888" y="395" fill="#D7A0B8" font-size="12">Ready</text><rect width="250" height="28" x="854" y="412" fill="#2C1F27" stroke="#4A3540" rx="14"/><circle cx="872" cy="426" r="4" fill="#D7A0B8"/><text x="888" y="431" fill="#D7A0B8" font-size="12">Needs your decision</text><text x="1176" y="466" fill="#F095C8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="end">gentle-ai.sdd-status/v2</text><rect width="1160" height="54" x="40" y="546" fill="#2A1B24" stroke="#5A3A49" rx="16"/><text x="620" y="571" fill="#F095C8" font-size="15" font-weight="700" text-anchor="middle">Same question, same answer</text><text x="620" y="591" fill="#A88E9B" font-size="12" text-anchor="middle">Ask again tomorrow, from another agent, on another model. The state lives in files, so the answer is read — not invented.</text><text x="620" y="644" fill="#8A6E7C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">gentle-ai sdd status</text></svg>